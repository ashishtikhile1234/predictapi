# ============================================================
# PredictAPI — Dev Profile (H2 in-memory, zero config)
# Activated via: --spring.profiles.active=dev
# ============================================================

spring:
  datasource:
    url: jdbc:h2:mem:predictapi_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console   # Browse DB at http://localhost:8080/h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop   # Recreate schema on every restart
    show-sql: true

logging:
  level:
    com.predictapi: DEBUG
    org.hibernate.SQL: DEBUG
